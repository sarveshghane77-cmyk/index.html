<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#020617">
<link rel="manifest" href="./manifest.json">
<title>SARVESH AI</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
*{box-sizing:border-box}

html,body{
width:100%;height:100%;margin:0;padding:0;
overflow:hidden!important;
background:#01030a;color:#e2e8f0;
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,input,textarea{font:inherit}
button{cursor:pointer}

#space{
position:fixed;inset:0;overflow:hidden;pointer-events:none;
background:
radial-gradient(circle at 50% 45%,rgba(20,80,110,.12),transparent 22%),
radial-gradient(circle at 20% 70%,rgba(50,20,110,.08),transparent 25%),
radial-gradient(circle at 80% 20%,rgba(0,130,170,.07),transparent 25%),
#01030a
}

#space:before{
content:"";position:absolute;width:2px;height:2px;left:5%;top:10%;
background:white;
box-shadow:
4vw 8vh #fff,10vw 35vh #bdefff,17vw 14vh #fff,
24vw 65vh #dff,31vw 22vh #fff,38vw 78vh #bdefff,
44vw 12vh #fff,51vw 31vh #dff,57vw 71vh #fff,
64vw 18vh #bdefff,71vw 52vh #fff,78vw 27vh #dff,
84vw 76vh #fff,91vw 43vh #bdefff,96vw 12vh #fff,
8vw 88vh #dff,14vw 48vh #fff,21vw 79vh #bdefff,
28vw 38vh #fff,35vw 91vh #dff,42vw 55vh #fff,
49vw 83vh #bdefff,56vw 7vh #fff,63vw 91vh #dff,
70vw 37vh #fff,77vw 84vh #bdefff,86vw 62vh #fff,
94vw 81vh #dff;
opacity:.7;
animation:starDrift 28s linear infinite
}

#space:after{
content:"";position:absolute;inset:-20%;
background-image:radial-gradient(circle,rgba(255,255,255,.75) 0 1px,transparent 1.5px);
background-size:125px 125px;
opacity:.22;
animation:deepSpace 65s linear infinite
}

@keyframes starDrift{
0%{transform:translate3d(0,0,0)}
50%{transform:translate3d(-35px,55px,0)}
100%{transform:translate3d(0,110px,0)}
}

@keyframes deepSpace{
0%{transform:translate3d(0,0,0) scale(1)}
50%{transform:translate3d(-50px,70px,0) scale(1.04)}
100%{transform:translate3d(-100px,140px,0) scale(1)}
}

.space-particles{
position:absolute;inset:0;overflow:hidden
}

.space-particles i{
position:absolute;width:2px;height:2px;border-radius:50%;
background:#67e8f9;box-shadow:0 0 8px #22d3ee;
animation:particleFloat linear infinite
}

.space-particles i:nth-child(1){left:8%;top:80%;animation-duration:15s}
.space-particles i:nth-child(2){left:18%;top:30%;animation-duration:22s}
.space-particles i:nth-child(3){left:28%;top:70%;animation-duration:18s}
.space-particles i:nth-child(4){left:39%;top:15%;animation-duration:25s}
.space-particles i:nth-child(5){left:51%;top:82%;animation-duration:19s}
.space-particles i:nth-child(6){left:63%;top:40%;animation-duration:23s}
.space-particles i:nth-child(7){left:74%;top:76%;animation-duration:17s}
.space-particles i:nth-child(8){left:87%;top:22%;animation-duration:21s}
.space-particles i:nth-child(9){left:94%;top:65%;animation-duration:27s}
.space-particles i:nth-child(10){left:45%;top:55%;animation-duration:20s}

@keyframes particleFloat{
0%{transform:translateY(80px);opacity:0}
20%{opacity:.8}
80%{opacity:.6}
100%{transform:translateY(-160px);opacity:0}
}

#loading{
position:fixed;inset:0;z-index:999;
display:flex;align-items:center;justify-content:center;
background:#020617;transition:opacity .5s
}

.loader-core{
width:110px;height:110px;border-radius:50%;
border:1px solid rgba(34,211,238,.35);
box-shadow:0 0 25px rgba(34,211,238,.35),inset 0 0 30px rgba(34,211,238,.15);
display:flex;align-items:center;justify-content:center;
animation:corePulse 2s ease-in-out infinite
}

.loader-core:before{
content:"";width:45px;height:45px;border-radius:50%;
border:2px solid #22d3ee;border-top-color:transparent;
animation:spin 1s linear infinite
}

@keyframes spin{to{transform:rotate(360deg)}}

@keyframes corePulse{
50%{
transform:scale(1.08);
box-shadow:0 0 50px rgba(34,211,238,.45),inset 0 0 40px rgba(34,211,238,.2)
}
}

#app{
position:relative;width:100%;height:100%;min-width:0;
overflow:hidden;display:flex
}

#sidebar{
position:fixed;left:0;top:0;bottom:0;width:290px;z-index:100;
display:flex;flex-direction:column;padding:18px;
background:linear-gradient(180deg,rgba(5,15,35,.96),rgba(2,6,23,.97));
border-right:1px solid rgba(34,211,238,.18);
box-shadow:10px 0 40px rgba(0,0,0,.25);
backdrop-filter:blur(25px)
}

.brand{
display:flex;align-items:center;gap:12px;padding:8px 4px 22px
}

.brand-core{
width:42px;height:42px;border-radius:14px;
display:flex;align-items:center;justify-content:center;
color:#67e8f9;border:1px solid rgba(34,211,238,.45);
background:rgba(34,211,238,.07);
box-shadow:0 0 25px rgba(34,211,238,.15)
}

.brand-title{
font-size:18px;font-weight:800;letter-spacing:.18em;color:#f8fafc
}

.brand-sub{
margin-top:2px;font-size:9px;letter-spacing:.22em;
color:rgba(103,232,249,.65);text-transform:uppercase
}

.new-chat{
width:100%;padding:13px 15px;border-radius:14px;color:#cffafe;
border:1px solid rgba(34,211,238,.25);
background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(99,102,241,.10));
transition:.2s
}

.new-chat:hover{
border-color:rgba(34,211,238,.65);
box-shadow:0 0 25px rgba(34,211,238,.12);
transform:translateY(-1px)
}

.history-label{
margin:25px 4px 10px;font-size:9px;letter-spacing:.25em;
color:rgba(148,163,184,.55);text-transform:uppercase
}

#chatHistory{
flex:1;overflow-y:auto;overflow-x:hidden;min-height:0
}

.history-item{
display:flex;align-items:center;justify-content:space-between;gap:8px;
width:100%;margin-bottom:6px;padding:11px 10px;border-radius:12px;
color:#94a3b8;border:1px solid transparent;background:transparent;
transition:.2s
}

.history-item:hover,.history-item.active{
color:#e2e8f0;border-color:rgba(34,211,238,.18);
background:rgba(34,211,238,.06)
}

.history-name{
flex:1;min-width:0;overflow:hidden;white-space:nowrap;
text-overflow:ellipsis;text-align:left;background:none;border:0;color:inherit
}

.history-menu{
width:28px;height:28px;border-radius:8px;color:#64748b;
background:transparent;border:0
}

.history-menu:hover{
color:#67e8f9;background:rgba(34,211,238,.08)
}

.sidebar-bottom{
display:flex;gap:8px;padding-top:12px
}

.sidebar-bottom button{
flex:1;padding:10px;border-radius:11px;color:#94a3b8;
background:rgba(15,23,42,.7);border:1px solid rgba(148,163,184,.10)
}

.sidebar-bottom button:hover{
color:#67e8f9;border-color:rgba(34,211,238,.25)
}

main{
position:relative;width:calc(100% - 290px);height:100%;
margin-left:290px;min-width:0;overflow:hidden
}

.topbar{
position:absolute;left:0;right:0;top:0;z-index:20;height:68px;
display:flex;align-items:center;justify-content:space-between;
padding:0 24px;border-bottom:1px solid rgba(148,163,184,.08);
background:rgba(2,6,23,.55);backdrop-filter:blur(20px)
}

.top-status{
display:flex;align-items:center;gap:9px;font-size:10px;
letter-spacing:.18em;color:#64748b;text-transform:uppercase
}

.status-dot{
width:7px;height:7px;border-radius:50%;background:#22d3ee;
box-shadow:0 0 12px #22d3ee;animation:statusPulse 1.8s ease-in-out infinite
}

@keyframes statusPulse{
50%{opacity:.3;transform:scale(.7)}
}

.mobile-menu{
display:none;width:40px;height:40px;border-radius:12px;color:#67e8f9;
background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.15)
}

#messages{
position:absolute;inset:68px 0 100px;overflow-y:auto;overflow-x:hidden;
padding:35px 24px 30px;scroll-behavior:smooth
}

.message-wrap{
width:100%;max-width:900px;margin:0 auto 22px;display:flex
}

.message-wrap.user{justify-content:flex-end}

.message{
max-width:min(760px,90%);padding:15px 17px;border-radius:18px;
line-height:1.65;overflow-wrap:anywhere;word-break:break-word
}

.message.ai{
color:#dbeafe;
background:linear-gradient(135deg,rgba(15,23,42,.82),rgba(8,47,73,.55));
border:1px solid rgba(34,211,238,.14);
box-shadow:0 10px 35px rgba(0,0,0,.18)
}

.message.user{
color:#ecfeff;
background:linear-gradient(135deg,rgba(8,47,73,.8),rgba(30,41,59,.8));
border:1px solid rgba(34,211,238,.20);
box-shadow:0 10px 35px rgba(0,0,0,.2)
}

.message img{
display:block;max-width:100%;height:auto;border-radius:14px
}

.attached-image{
display:block;
max-width:min(420px,100%);
max-height:420px;
object-fit:contain;
margin-bottom:10px;
border-radius:14px;
border:1px solid rgba(103,232,249,.18)
}

.image-download-wrap{
display:flex;
align-items:center;
margin-top:10px
}

.download-image-btn{
display:inline-flex;
align-items:center;
justify-content:center;
gap:7px;
padding:9px 13px;
border-radius:11px;
color:#67e8f9;
background:rgba(34,211,238,.06);
border:1px solid rgba(34,211,238,.16);
font-size:13px;
transition:.2s
}

.download-image-btn:hover{
color:#020617;
background:#67e8f9;
border-color:#67e8f9;
box-shadow:0 0 20px rgba(34,211,238,.25)
}

.download-image-btn svg{
flex:0 0 auto
}

.markdown-content pre{
max-width:100%;overflow:auto;padding:14px;border-radius:12px;
background:rgba(0,0,0,.35)
}

.markdown-content code{overflow-wrap:anywhere}
.markdown-content a{color:#67e8f9}

.markdown-content img,
.markdown-content video{
max-width:100%
}

#welcome{
position:absolute;inset:68px 0 100px;display:flex;
align-items:center;justify-content:center;padding:30px;pointer-events:none
}

.welcome-inner{
width:min(650px,100%);text-align:center
}

.orbital{
width:190px;height:190px;margin:0 auto 32px;border-radius:50%;
position:relative;display:flex;align-items:center;justify-content:center;
animation:planetFloat 5s ease-in-out infinite
}

.orbital:before{
content:"";position:absolute;inset:-23px;border-radius:50%;
border:1px solid rgba(34,211,238,.28);
border-left-color:transparent;border-right-color:rgba(34,211,238,.65);
box-shadow:0 0 25px rgba(34,211,238,.12);
animation:outerOrbit 8s linear infinite
}

.orbital:after{
content:"";position:absolute;width:245px;height:78px;border-radius:50%;
border:1px solid rgba(99,102,241,.35);
box-shadow:0 0 20px rgba(99,102,241,.10);
transform:rotate(-28deg);animation:ringTilt 5s linear infinite
}

.orb-core{
width:108px;height:108px;position:relative;border-radius:50%;overflow:hidden;
background:radial-gradient(circle at 34% 28%,#9ffcff 0%,#28c7df 9%,#087f9d 25%,#063c58 48%,#020c18 72%,#00040a 100%);
border:1px solid rgba(103,232,249,.75);
box-shadow:0 0 22px rgba(34,211,238,.65),0 0 65px rgba(34,211,238,.24),
inset -20px -12px 35px rgba(0,0,0,.75),inset 10px 5px 25px rgba(103,232,249,.30);
animation:planetSpin 9s linear infinite
}

.orb-core:before{
content:"";position:absolute;inset:-10%;
background:
repeating-linear-gradient(12deg,transparent 0 8px,rgba(103,232,249,.16) 9px 10px,transparent 11px 18px),
repeating-linear-gradient(100deg,transparent 0 13px,rgba(0,0,0,.22) 14px 18px,transparent 19px 27px);
mix-blend-mode:screen;animation:surfaceMove 3s linear infinite
}

.orb-core:after{
content:"";position:absolute;inset:-2px;border-radius:50%;
border:2px solid rgba(103,232,249,.45);
box-shadow:inset 4px 0 12px rgba(103,232,249,.5),inset -10px 0 20px rgba(0,0,0,.8)
}

.atom-system{
position:absolute;inset:-58px;border-radius:50%;
animation:atomSystemSpin 12s linear infinite
}

.atom{
position:absolute;width:9px;height:9px;border-radius:50%;
background:#a5f3fc;box-shadow:0 0 7px #22d3ee,0 0 18px rgba(34,211,238,.9)
}

.atom:nth-child(1){left:50%;top:-4px}
.atom:nth-child(2){right:2px;top:32%}
.atom:nth-child(3){right:20%;bottom:-3px}
.atom:nth-child(4){left:8%;bottom:17%}
.atom:nth-child(5){left:-4px;top:27%}
.atom:nth-child(6){left:27%;top:4px;width:6px;height:6px}
.atom:nth-child(7){right:25%;top:8%;width:6px;height:6px}
.atom:nth-child(8){right:3%;bottom:25%;width:5px;height:5px}

.atom-system:before,.atom-system:after{
content:"";position:absolute;inset:12px;border-radius:50%;
border:1px solid rgba(34,211,238,.17)
}

.atom-system:after{
transform:rotate(62deg);border-color:rgba(99,102,241,.2)
}

@keyframes planetSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes surfaceMove{from{transform:translateX(-15px)}to{transform:translateX(15px)}}
@keyframes atomSystemSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes outerOrbit{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes ringTilt{from{transform:rotate(-28deg)}to{transform:rotate(332deg)}}
@keyframes planetFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.core-scan{
position:absolute;width:270px;height:1px;
background:linear-gradient(90deg,transparent,rgba(34,211,238,.7),transparent);
opacity:.45;animation:scanLine 3.5s ease-in-out infinite
}

@keyframes scanLine{
0%,100%{transform:translateY(-105px);opacity:0}
40%{opacity:.5}
50%{transform:translateY(105px);opacity:0}
}

.core-sparks{position:absolute;inset:-95px}

.core-sparks span{
position:absolute;width:3px;height:3px;border-radius:50%;
background:#67e8f9;box-shadow:0 0 8px #22d3ee;
animation:sparkMove 3s ease-in-out infinite
}

.core-sparks span:nth-child(1){left:20%;top:25%}
.core-sparks span:nth-child(2){right:17%;top:33%;animation-delay:.5s}
.core-sparks span:nth-child(3){left:30%;bottom:20%;animation-delay:1s}
.core-sparks span:nth-child(4){right:26%;bottom:15%;animation-delay:1.5s}
.core-sparks span:nth-child(5){left:5%;top:50%;animation-delay:2s}
.core-sparks span:nth-child(6){right:5%;top:62%;animation-delay:2.4s}

@keyframes sparkMove{
0%,100%{transform:scale(.5);opacity:.15}
50%{transform:scale(1.8);opacity:1}
}

.welcome-title{
font-size:clamp(28px,5vw,48px);font-weight:800;letter-spacing:.08em;
color:#f8fafc;text-shadow:0 0 25px rgba(103,232,249,.18)
}

.welcome-text{
margin-top:10px;color:#64748b;font-size:14px
}

.input-zone{
position:absolute;left:0;right:0;bottom:0;z-index:30;padding:15px 24px 20px;
background:linear-gradient(180deg,transparent,rgba(2,6,23,.96) 25%)
}

#attachmentPreview{
width:min(900px,100%);
margin:0 auto 7px;
display:none;
align-items:center;
gap:9px;
padding:7px 9px;
border-radius:14px;
background:rgba(5,15,35,.92);
border:1px solid rgba(34,211,238,.16);
backdrop-filter:blur(20px)
}

#attachmentPreview img{
width:48px;
height:48px;
object-fit:cover;
border-radius:9px;
border:1px solid rgba(103,232,249,.2)
}

.attachment-info{
flex:1;
min-width:0
}

.attachment-name{
font-size:12px;
color:#cbd5e1;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.attachment-status{
font-size:10px;
color:#64748b;
margin-top:2px
}

#removeAttachmentBtn{
width:30px;
height:30px;
border-radius:9px;
border:1px solid rgba(148,163,184,.12);
background:rgba(15,23,42,.8);
color:#94a3b8
}

#removeAttachmentBtn:hover{
color:#67e8f9;
border-color:rgba(34,211,238,.25)
}

#chatForm{
width:min(900px,100%);margin:auto;display:flex;align-items:flex-end;gap:9px;
padding:8px;border-radius:20px;border:1px solid rgba(34,211,238,.18);
background:rgba(5,15,35,.88);
box-shadow:0 15px 50px rgba(0,0,0,.3),0 0 30px rgba(34,211,238,.04);
backdrop-filter:blur(20px)
}

#messageInput{
flex:1;min-width:0;max-height:150px;resize:none;outline:none;border:0;
background:transparent;color:#e2e8f0;padding:12px 8px
}

#messageInput::placeholder{color:#475569}

.icon-btn{
flex:0 0 auto;width:43px;height:43px;display:flex;
align-items:center;justify-content:center;border-radius:13px;color:#67e8f9;
background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.13);
transition:.2s
}

.icon-btn:hover{
background:rgba(34,211,238,.13);
border-color:rgba(34,211,238,.35);
box-shadow:0 0 18px rgba(34,211,238,.12)
}

#sendBtn{
color:#020617;background:#67e8f9;border-color:#67e8f9
}

#sendBtn:hover{
background:#a5f3fc;box-shadow:0 0 25px rgba(34,211,238,.35)
}

#chatActionMenu,#toolsMenu{
position:fixed;z-index:350;display:none;
padding:6px;border-radius:12px;background:rgba(5,15,35,.98);
border:1px solid rgba(34,211,238,.2);
box-shadow:0 15px 45px rgba(0,0,0,.45);backdrop-filter:blur(20px)
}

#chatActionMenu{width:140px}
#toolsMenu{width:210px}

#chatActionMenu button,#toolsMenu button{
display:block;width:100%;padding:9px 10px;border:0;border-radius:8px;
text-align:left;color:#cbd5e1;background:transparent
}

#chatActionMenu button:hover,#toolsMenu button:hover{
color:#67e8f9;background:rgba(34,211,238,.08)
}

.modal-bg{
position:fixed;inset:0;z-index:500;display:none;
align-items:center;justify-content:center;padding:20px;
background:rgba(0,0,0,.65);backdrop-filter:blur(10px)
}

.modal{
width:min(430px,100%);padding:22px;border-radius:20px;
background:#07111f;border:1px solid rgba(34,211,238,.2);
box-shadow:0 25px 80px rgba(0,0,0,.55)
}

.modal h2{margin:0 0 15px;font-size:18px;color:#f8fafc}

.modal input{
width:100%;padding:12px;outline:none;border-radius:11px;color:#e2e8f0;
background:#020617;border:1px solid rgba(148,163,184,.15)
}

.modal-actions{
display:flex;justify-content:flex-end;gap:8px;margin-top:16px
}

.modal-actions button{
padding:9px 14px;border-radius:10px;
border:1px solid rgba(148,163,184,.15);
color:#cbd5e1;background:#0f172a
}

.modal-actions .primary{
color:#020617;background:#67e8f9;border-color:#67e8f9
}

.typing{display:flex;gap:5px;padding:5px 0}

.typing span{
width:6px;height:6px;border-radius:50%;background:#67e8f9;
animation:typeDot 1s infinite
}

.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

@keyframes typeDot{
0%,60%,100%{opacity:.25;transform:translateY(0)}
30%{opacity:1;transform:translateY(-4px)}
}

.voice-active{
color:#020617!important;background:#67e8f9!important;
border-color:#67e8f9!important;
box-shadow:0 0 25px rgba(34,211,238,.30)
}

.message-tools{
display:flex;align-items:center;gap:6px;margin-top:8px
}

.message-speaker{
width:32px;height:32px;display:flex;align-items:center;
justify-content:center;border-radius:10px;color:#67e8f9;
background:rgba(34,211,238,.05);
border:1px solid rgba(34,211,238,.12);
transition:.2s;padding:0
}

.message-speaker:hover{
color:#a5f3fc;background:rgba(34,211,238,.12);
border-color:rgba(34,211,238,.35);
box-shadow:0 0 15px rgba(34,211,238,.10)
}

@media(max-width:767px){

#sidebar{
width:min(86vw,320px);transform:translateX(-105%);
transition:transform .25s ease
}

#sidebar.open{transform:translateX(0)}

main{width:100%;margin-left:0}

.mobile-menu{display:block}

.topbar{padding:0 13px}

#messages{padding:25px 12px 25px}

.message{max-width:94%}

#welcome{padding:20px}

.orbital{width:150px;height:150px}

.orb-core{width:85px;height:85px}

.orbital:after{width:200px;height:65px}

.input-zone{padding:10px 10px 12px}

#chatForm{border-radius:17px}

.icon-btn{width:40px;height:40px}

.top-status{font-size:8px}

#toolsMenu{width:190px}

.message-speaker{width:30px;height:30px}

.download-image-btn{
padding:8px 11px;
font-size:12px
}

#attachmentPreview{
margin-bottom:6px
}

}

html,body,#app,main,#messages,#chatForm,.markdown-content{
max-width:100%;min-width:0
}

.markdown-content,.markdown-content *{
overflow-wrap:anywhere;word-break:break-word

/* =========================================================
   WEBINTO.APP NATIVE BRIDGE
   ========================================================= */

function hasWebIntoBridge(){

return !!(
window.Native &&
typeof window.Native.call==="function"
);

}


async function waitForWebInto(){

if(typeof window.waitForNative==="function"){

try{

const ready=
await window.waitForNative(3000);

if(ready)return true;

}catch(e){}

}

return hasWebIntoBridge();

}


function nativeCall(method,payload){

return new Promise(async resolve=>{

const ready=
await waitForWebInto();

if(!ready){

resolve(null);
return;

}

let finished=false;

const done=result=>{

if(finished)return;

finished=true;

try{

if(typeof result==="string"){

try{
resolve(JSON.parse(result));
}catch{
resolve(result);
}

}else{

resolve(result);

}

}catch{

resolve(result);

}

};

try{

const result=
window.Native.call(
method,
payload,
done
);

if(
result &&
typeof result.then==="function"
){

result.then(done).catch(
()=>done(null)
);

}else if(
result !== undefined &&
result !== null
){

done(result);

}

}catch(error){

resolve(null);

}

setTimeout(
()=>{

if(!finished)
resolve(null);

},
5000
);

});

}


async function requestWebIntoMicrophone(){

if(!hasWebIntoBridge())
return false;

try{

const result=
await nativeCall(
"permissions",
{
action:"ASK_FOR_PERMISSION",
payload:{
permission:"AUDIO"
}
}
);

if(!result)
return false;

if(
result.status===true ||
result.granted===true ||
result.allowed===true
){

return true;

}

if(
typeof result==="string" &&
/granted|allowed|true/i.test(result)
){

return true;

}

return false;

}catch(error){

return false;

}

}

/* =========================================================
   SPEECH
   ========================================================= */

function textForSpeech(text){

if(!text)return"";

let value=String(text);

value=value.replace(/```[\s\S]*?```/g,"");
value=value.replace(/<img[\s\S]*?>/gi,"");
value=value.replace(/<[^>]*>/g," ");
value=value.replace(/!\[[^\]]*\]\([^)]+\)/g,"");
value=value.replace(/\[([^\]]+)\]\([^)]+\)/g,"$1");
value=value.replace(/[*_~`#>]/g,"");

const decoder=
document.createElement("textarea");

decoder.innerHTML=value;

value=decoder.value;

return value
.replace(/\s+/g," ")
.trim();

}


function splitSpeechText(text){

const clean=textForSpeech(text);

if(!clean)return[];

const chunks=[];
let remaining=clean;
const maxLength=210;

while(remaining.length>maxLength){

let cut=
remaining.lastIndexOf(". ",maxLength);

cut=Math.max(
cut,
remaining.lastIndexOf("? ",maxLength),
remaining.lastIndexOf("! ",maxLength)
);

if(cut<80)
cut=remaining.lastIndexOf(", ",maxLength);

if(cut<80)
cut=remaining.lastIndexOf(" ",maxLength);

if(cut<1)
cut=maxLength;

chunks.push(
remaining.slice(0,cut+1).trim()
);

remaining=
remaining.slice(cut+1).trim();

}

if(remaining)
chunks.push(remaining);

return chunks;

}


function detectSpeechLanguage(text){

if(/[\u0900-\u097F]/.test(text))
return"hi-IN";

return"en-IN";

}


function getSpeechVoices(){

if(!("speechSynthesis"in window))
return[];

return speechSynthesis.getVoices()||[];

}


function selectVoice(lang){

const voices=getSpeechVoices();

if(!voices.length)
return null;

const wanted=
lang.toLowerCase();

let voice=
voices.find(v=>
(v.lang||"").toLowerCase()===wanted
);

if(voice)return voice;

const short=
wanted.split("-")[0];

voice=
voices.find(v=>
(v.lang||"").toLowerCase()
.startsWith(short)
);

if(voice)return voice;

if(short==="hi"){

voice=
voices.find(v=>
/hindi|india/i.test(
(v.name||"")+" "+(v.lang||"")
)
);

if(voice)return voice;

}

if(short==="en"){

voice=
voices.find(v=>
/india|indian/i.test(
(v.name||"")+" "+(v.lang||"")
)
);

if(voice)return voice;

}

return voices[0]||null;

}


function speakText(text){

if(!("speechSynthesis"in window))
return;

const clean=textForSpeech(text);

if(!clean)return;

stopSpeech();

speechChunks=
splitSpeechText(clean);

speechIndex=0;

speakNextChunk();

}


function speakNextChunk(){

if(
speechIndex>=speechChunks.length
){

speechChunks=[];
speechIndex=0;
return;

}

const chunk=
speechChunks[speechIndex];

const utterance=
new SpeechSynthesisUtterance(chunk);

const lang=
detectSpeechLanguage(chunk);

utterance.lang=lang;

const voice=
selectVoice(lang);

if(voice)
utterance.voice=voice;

utterance.rate=.95;
utterance.pitch=1;
utterance.volume=1;

utterance.onend=()=>{

speechIndex++;

setTimeout(
()=>speakNextChunk(),
30
);

};

utterance.onerror=()=>{

speechChunks=[];
speechIndex=0;

};

speechSynthesis.speak(
utterance
);

}


function stopSpeech(){

if("speechSynthesis"in window){

try{
speechSynthesis.cancel();
}catch{}

}

speechChunks=[];
speechIndex=0;

}


/* =========================================================
   IMAGE COMPRESSION
   ========================================================= */

function fileToDataURL(file){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=()=>{
resolve(reader.result);
};

reader.onerror=reject;

reader.readAsDataURL(file);

});

}


async function compressImage(file){

if(!file)
throw new Error("No image selected.");

const originalData=
await fileToDataURL(file);

return new Promise((resolve,reject)=>{

const img=new Image();

img.onload=()=>{

try{

let width=img.naturalWidth;
let height=img.naturalHeight;

const scale=
Math.min(
1,
MAX_IMAGE_DIMENSION/
Math.max(width,height)
);

width=
Math.max(
1,
Math.round(width*scale)
);

height=
Math.max(
1,
Math.round(height*scale)
);

const canvas=
document.createElement("canvas");

canvas.width=width;
canvas.height=height;

const ctx=
canvas.getContext("2d");

if(!ctx){

resolve(originalData);
return;

}

ctx.drawImage(
img,
0,
0,
width,
height
);

let result=
canvas.toDataURL(
"image/jpeg",
IMAGE_JPEG_QUALITY
);

if(!result || result.length<100){

result=originalData;

}

resolve(result);

}catch(error){

resolve(originalData);

}

};

img.onerror=()=>{
resolve(originalData);
};

img.src=originalData;

});

}

/* =========================================================

   ========================================================= */

async function downloadGeneratedImage(button){

try{

const wrap =
button.closest(".message-wrap");

if(!wrap)
return;

const image =
wrap.querySelector(
".generated-image-container img"
);

if(!image || !image.src)
return;

const source=image.src;

if(source.startsWith("data:")){

const parts=source.split(",");

if(parts.length<2)
throw new Error("Invalid image data.");

const header=parts[0];

const base64=
parts.slice(1).join(",");

const mime=
(
header.match(
/data:([^;]+)/i
)||[]
)[1]||
"image/png";

const binary=atob(base64);

const bytes=
new Uint8Array(binary.length);

for(let i=0;i<binary.length;i++)
bytes[i]=binary.charCodeAt(i);

const blob=
new Blob(
[bytes],
{type:mime}
);

const blobUrl=
URL.createObjectURL(blob);

const link=
document.createElement("a");

link.href=blobUrl;

link.download=
"SARVESH-AI-Generated-Image.png";

link.style.display="none";

document.body.appendChild(link);

link.click();

link.remove();

setTimeout(
()=>URL.revokeObjectURL(blobUrl),
10000
);

return;

}

if(
source.startsWith("http://") ||
source.startsWith("https://")
){

try{

const response=
await fetch(
source,
{mode:"cors"}
);

if(response.ok){

const blob=
await response.blob();

const blobUrl=
URL.createObjectURL(blob);

const link=
document.createElement("a");

link.href=blobUrl;

link.download=
"SARVESH-AI-Generated-Image.png";

link.style.display="none";

document.body.appendChild(link);

link.click();

link.remove();

setTimeout(
()=>URL.revokeObjectURL(blobUrl),
10000
);

return;

}

}catch{}

const opened=
window.open(
source,
"_blank"
);

if(opened){

try{opened.focus();}catch{}

}else{

window.location.href=source;

}

return;

}

if(source.startsWith("blob:")){

const link=
document.createElement("a");

link.href=source;

link.download=
"SARVESH-AI-Generated-Image.png";

link.style.display="none";

document.body.appendChild(link);

link.click();

link.remove();

return;

}

}catch(error){

try{

const image=
button
.closest(".message-wrap")
?.querySelector(
".generated-image-container img"
);

if(image?.src){

const opened=
window.open(
image.src,
"_blank"
);

if(!opened)
window.location.href=image.src;

}

}catch{}

}

}


/* =========================================================

/* =========================================================
   128K CONTEXT PROTECTION
   ========================================================= */

function trimTextForRequest(text){

if(!text)
return"";

text=String(text);

if(text.length<=MAX_MESSAGE_CHARS)
return text;

return text.slice(
0,
MAX_MESSAGE_CHARS
)+
"\n\n[Earlier portion of this message was shortened for context protection.]";

}


function buildCompactMessages(chat){

if(!chat || !Array.isArray(chat.messages))
return[];

const source=
chat.messages.slice(
-MAX_REQUEST_MESSAGES
);

const result=[];

let totalChars=0;

for(let i=source.length-1;i>=0;i--){

const msg=source[i];

if(!msg)
continue;

const role=
msg.role==="assistant"
?"assistant":"user";


/*
   Never resend old image base64 data.

   Only the current attached image is sent separately.
*/

let content=
trimTextForRequest(
msg.content||""
);

if(!content && msg.imageData){

content=
"[Image was attached in an earlier message.]";

}

if(!content)
continue;

const item={
role,
content
};

const size=
JSON.stringify(item).length;

if(
totalChars+size >
MAX_REQUEST_CHARS
){

break;

}

result.unshift(item);

totalChars+=size;

}

return result;

}


/* =========================================================
   LIVE WEB DETECTION
   ========================================================= */

function shouldUseLiveWeb(text){

if(!LIVE_WEB_FLAG)
return false;

if(!text)
return false;

const value=
text.toLowerCase();

const keywords=[

"latest",
"today",
"current",
"right now",
"live",
"news",
"weather",
"price",
"stock",
"score",
"standings",
"schedule",
"recent",
"2026",
"search internet",
"search web",
"look online",
"on the internet",
"what is happening",
"who is",
"where is",
"location",
"current location"

];

return keywords.some(
word=>value.includes(word)
);

}


/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage(
text,
options={}
){

const chat=
ensureChat();

const image=
options.image||
pendingImage||
null;


/*
   Prevent the exact problem visible in your screenshot.

   An image-only request always receives a valid user
   instruction instead of sending an empty user message.
*/

let userText=
(text||"").trim();

if(!userText && image){

userText=
"Please analyze the attached image and help me with it.";

}


/*
   Absolutely do not send an empty user message.
*/

if(!userText && !image){

return;

}


const userMessage={
role:"user",
content:userText
};

if(image){

userMessage.imageData=
image.data;

userMessage.imageName=
image.name;

userMessage.imageType=
image.type;

}

chat.messages.push(
userMessage
);

setChatTitle(chat);

saveChats();

renderHistory();
renderMessages();

pendingImage=null;

$("attachmentPreview").style.display=
"none";

$("attachmentPreviewImage").src="";

addTyping();

$("messageInput").value="";

$("messageInput").style.height="auto";


try{

const savedSystem=
localStorage.getItem(
SYSTEM_KEY
)||"";

const system=
CREATOR_IDENTITY+
"\n"+
savedSystem;


/*
   Compact conversation for the Worker.
*/

const compactMessages=
buildCompactMessages(chat);


/*
   Build the current multimodal user message.

   The image is included ONLY in the current request.
   Old images are deliberately excluded.
*/

let requestMessages=
compactMessages;


/*
   Replace the last user message with multimodal
   content when an image is attached.
*/

if(image){

requestMessages=
compactMessages.slice(
0,
Math.max(0,compactMessages.length-1)
);

requestMessages.push({

role:"user",

content:[

{
type:"text",
text:userText
},

{
type:"image_url",
image_url:{
url:image.data
}
}

]

});

}


/*
   Tell Worker whether current request needs web search.
*/

const useLiveWeb=
shouldUseLiveWeb(userText);


/*
   This payload is backward-compatible with your existing
   Worker while adding the new capabilities.
*/

const payload={

messages:requestMessages,

system,

/*
   New image-editing information.
*/

imageAttachment:image
?{
present:true,
name:image.name,
type:image.type
}
:null,

/*
   New live-web instruction.
*/

webSearch:useLiveWeb,

internetAccess:LIVE_WEB_FLAG,

/*
   Helps the Worker understand this is a multimodal
   request.
*/

multimodal:!!image,

/*
   Context safety information.
*/

contextMode:"compact",
maxContextMessages:MAX_REQUEST_MESSAGES

};


const response=
await fetch(
API_URL,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(payload)
}
);


let data=null;

try{

data=
await response.json();

}catch{

data=null;

}


if(!response.ok){

throw new Error(
data?.error||
data?.details||
"Server error: "+
response.status
);

}


let reply="";


if(typeof data==="string"){

reply=data;

}

else if(data?.reply){

reply=data.reply;

}

else if(data?.response){

reply=data.response;

}

else if(data?.message){

reply=data.message;

}

else if(data?.content){

reply=data.content;

}

else if(
data?.choices &&
data.choices[0] &&
data.choices[0].message
){

const message=
data.choices[0].message;

if(typeof message.content==="string"){

reply=message.content;

}else if(Array.isArray(message.content)){

reply=
message.content
.map(part=>
typeof part==="string"
?part
:part?.text||""
)
.join("");

}

}

else{

reply=
JSON.stringify(data);

}


if(!reply){

throw new Error(
"Server returned an empty reply."
);

}


chat.messages.push({

role:"assistant",

content:reply

});

saveChats();

removeTyping();

renderMessages();


if(
voiceEnabled &&
reply
){

setTimeout(
()=>speakText(reply),
50
);

}


}catch(error){

removeTyping();

const errorText=
"⚠️ Connection error: "+
(
error?.message||
"Unknown server error."
);

chat.messages.push({

role:"assistant",

content:errorText

});

saveChats();

renderMessages();


if(voiceEnabled){

setTimeout(
()=>speakText(errorText),
50
);

}

}

}

async function generateImage(prompt){

const chat=
ensureChat();

chat.messages.push({

role:"user",

"Generate image: "+
prompt

});

renderHistory();
renderMessages();

addTyping();


try{

const response=
await fetch(
API_URL,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

type:"image",

prompt

})
}
);


let data=null;

try{

data=
await response.json();

}catch{}


if(!response.ok){

throw new Error(
data?.error||
data?.details||
"Image server error: "+
response.status
);

}


let imageUrl=
data?.image;


if(
imageUrl &&
typeof imageUrl==="string"
){

if(
!imageUrl.startsWith("http") &&
!imageUrl.startsWith("data:")
){

imageUrl=
"data:image/jpeg;base64,"+
imageUrl;

}

removeTyping();

chat.messages.push({

content:
`<div class="generated-image-container">
<img src="${imageUrl}" alt="Generated image"
style="max-width:100%;height:auto;border-radius:14px;display:block;">
</div>`

});

}else{

throw new Error(
data?.error||
"The image was generated but no image data was returned."
);

}


saveChats();

renderMessages();


}catch(error){

removeTyping();

const errorText=
"⚠️ Image generation error: "+
(
error?.message||
"Unknown image generation error."
);

chat.messages.push({

role:"assistant",

content:errorText

});

saveChats();

renderMessages();

}

}

/* =========================================================
   MICROPHONE
   ========================================================= */

async function prepareMicrophone(){

if(
window.Native &&
typeof window.Native.call==="function"
){

try{

const granted=
await requestWebIntoMicrophone();

if(granted)
return true;

}catch{}

}

if(
navigator.mediaDevices &&
typeof navigator.mediaDevices.getUserMedia===
"function"
){

try{

const stream=
await navigator.mediaDevices
.getUserMedia({
audio:true
});

stream.getTracks()
.forEach(
track=>track.stop()
);

return true;

}catch(error){

console.log(
"Microphone permission:",
error
);

}

}

return false;

}


function getSpeechRecognition(){

return window.SpeechRecognition ||
window.webkitSpeechRecognition ||
null;

}


async function setupVoiceRecognition(){

const SpeechRecognition=
getSpeechRecognition();

if(!SpeechRecognition)
return false;

recognition=
new SpeechRecognition();

recognition.lang=
"en-IN";

recognition.continuous=
false;

recognition.interimResults=
false;

recognition.maxAlternatives=
1;


recognition.onstart=()=>{

isListening=true;
recognitionStarting=false;

$("micBtn")
.classList.add(
"voice-active"
);

$("micBtn").title=
"Listening...";

};


recognition.onresult=
event=>{

const result=
event.results &&
event.results[0] &&
event.results[0][0];

if(!result)
return;

const transcript=
result.transcript||"";

const input=
$("messageInput");

const existing=
input.value.trim();

input.value=
existing
?existing+" "+transcript
:transcript;

input.dispatchEvent(
new Event("input")
);

input.focus();

};


recognition.onerror=
event=>{

isListening=false;
recognitionStarting=false;

$("micBtn")
.classList.remove(
"voice-active"
);

$("micBtn").title=
"Voice input";


if(
event.error==="not-allowed" ||
event.error==="service-not-allowed"
){

alert(
"Microphone permission is required. Please allow microphone access for SARVESH AI in WebInto.app."
);

}

};


recognition.onend=()=>{

isListening=false;
recognitionStarting=false;

$("micBtn")
.classList.remove(
"voice-active"
);

$("micBtn").title=
"Voice input";

};

return true;

}


$("micBtn").onclick=
async()=>{

if(isListening){

try{

recognition.stop();

}catch{}

return;

}

if(recognitionStarting)
return;

const SpeechRecognition=
getSpeechRecognition();

if(!SpeechRecognition){

alert(
"Voice input is not supported by this WebView. Please use a WebInto.app build with microphone permission enabled."
);

return;

}

recognitionStarting=true;

$("micBtn").title=
"Requesting microphone...";

const permission=
await prepareMicrophone();

if(!permission){

recognitionStarting=false;

$("micBtn").title=
"Voice input";

alert(
"Microphone permission was not granted. In WebInto.app, enable microphone/audio permission and rebuild the app."
);

return;

}

try{

if(!recognition){

await setupVoiceRecognition();

}

recognition.start();

}catch(error){

recognitionStarting=false;

$("micBtn")
.classList.remove(
"voice-active"
);

$("micBtn").title=
"Voice input";

console.log(
"Speech recognition start error:",
error
);

}

};

   ========================================================= */

if(
"serviceWorker"in navigator
){

window.addEventListener(
"load",
()=>{

navigator.serviceWorker
.register("./sw.js")
.catch(()=>{});

}
);

}

startApp();
