<script>

const API_URL =
"https://sarvesh-ai.sarveshghane77.workers.dev";

const CHAT_KEY =
"sarvesh_chats_v8";

const ACTIVE_KEY =
"sarvesh_active_v8";

const SYSTEM_KEY =
"sarvesh_system_v8";

let chats = [];
let active = null;
let selected = null;
let attached = null;
let rec = null;
let listening = false;
let busy = false;

const $ = id =>
document.getElementById(id);

const uid = () =>
Date.now() +
Math.random()
.toString(36)
.slice(2,7);


/* =========================
   CREATOR IDENTITY
========================= */

const CREATOR_IDENTITY = `
You are SARVESH AI.

Your name is SARVESH AI.

You were created and developed by Sarvesh Ghane.

If the user asks:
"Who created you?"
"Who developed you?"
"Who made you?"
"Who is your creator?"
"Who is your developer?"

Answer clearly:

"SARVESH AI was created and developed by Sarvesh Ghane."

Never claim that OpenAI created SARVESH AI.

Be helpful, accurate and honest.
`;


/* =========================
   STORAGE
========================= */

function save(){

localStorage.setItem(
CHAT_KEY,
JSON.stringify(chats)
);

localStorage.setItem(
ACTIVE_KEY,
active || ""
);

}

function load(){

try{

chats =
JSON.parse(
localStorage.getItem(CHAT_KEY) || "[]"
);

}catch(e){

chats = [];

}

active =
localStorage.getItem(ACTIVE_KEY);

if(!Array.isArray(chats)){
chats = [];
}

if(!chats.length){

const c = {
id:uid(),
title:"New Conversation",
messages:[]
};

chats = [c];

active = c.id;

save();

}

if(!chats.some(c => c.id === active)){

active = chats[0].id;

}

}

function current(){

return (
chats.find(c => c.id === active) ||
chats[0]
);

}


/* =========================
   HISTORY
========================= */

function renderHistory(){

const h =
$("history");

h.innerHTML = "";

chats.forEach(c => {

const row =
document.createElement("div");

row.className =
"hist " +
(c.id === active ? "active" : "");

const title =
document.createElement("span");

title.className =
"hist-title";

title.textContent =
c.title;

const menu =
document.createElement("button");

menu.className =
"icon-btn hist-menu";

menu.setAttribute(
"aria-label",
"Conversation options"
);

menu.title =
"Conversation options";

menu.innerHTML = `
<svg viewBox="0 0 24 24">
<circle cx="5" cy="12" r="1.3"
fill="currentColor" stroke="none"/>
<circle cx="12" cy="12" r="1.3"
fill="currentColor" stroke="none"/>
<circle cx="19" cy="12" r="1.3"
fill="currentColor" stroke="none"/>
</svg>
`;

menu.onclick = e => {

e.stopPropagation();

selected = c.id;

openChatMenu(
e.clientX,
e.clientY
);

};

row.onclick = () => {

active = c.id;

save();

renderHistory();

render();

$("sidebar")
.classList.remove("open");

};

row.appendChild(title);
row.appendChild(menu);

h.appendChild(row);

});

}


/* =========================
   MESSAGE RENDERING
========================= */

function render(){

const box =
$("messages");

const c =
current();

box.innerHTML = "";

if(!c.messages.length){

box.innerHTML = `
<div class="welcome">

<div>

<div class="orb"></div>

<h1>SARVESH AI</h1>

<p>
Neural intelligence created and developed by Sarvesh Ghane.
</p>

</div>

</div>
`;

return;

}

c.messages.forEach(m => {

addUI(
m.role,
m.content,
m.image || null,
false
);

});

scroll();

}


function addUI(
role,
text,
image = null,
go = true
){

const row =
document.createElement("div");

row.className =
"msg " + role;

const bubble =
document.createElement("div");

bubble.className =
"bubble";

if(image){

const img =
document.createElement("img");

img.src =
image;

img.alt =
"Attached image";

img.style.cssText =
"display:block;max-width:280px;max-height:360px;object-fit:contain;margin-bottom:" +
(text ? "8px" : "0");

bubble.appendChild(img);

}

if(text){

const content =
document.createElement("div");

if(role === "assistant"){

try{

content.innerHTML =
marked.parse(text);

}catch(e){

content.textContent =
text;

}

}else{

content.textContent =
text;

}

bubble.appendChild(content);

}

if(role === "assistant"){

const assistant =
document.createElement("div");

assistant.className =
"assistant-row";

assistant.innerHTML = `

<div class="assistant-icon">

<svg viewBox="0 0 24 24">

<path d="M12 3v18"/>
<path d="M3 12h18"/>
<path d="M5.5 5.5l13 13"/>
<path d="M18.5 5.5l-13 13"/>
<circle cx="12" cy="12" r="3"/>

</svg>

</div>

`;

assistant.appendChild(bubble);

row.appendChild(assistant);

}else{

row.appendChild(bubble);

}

$("messages")
.appendChild(row);

if(go){
scroll();
}

}


function scroll(){

requestAnimationFrame(() => {

$("messages").scrollTop =
$("messages").scrollHeight;

});

}


function typing(show){

document
.querySelector(".typingRow")
?.remove();

if(!show){
return;
}

const row =
document.createElement("div");

row.className =
"msg assistant typingRow";

row.innerHTML = `

<div class="assistant-row">

<div class="assistant-icon">

<svg viewBox="0 0 24 24">
<path d="M12 3v18"/>
<path d="M3 12h18"/>
<path d="M5.5 5.5l13 13"/>
<path d="M18.5 5.5l-13 13"/>
<circle cx="12" cy="12" r="3"/>
</svg>

</div>

<div class="bubble">

<span class="typing">
<i></i>
<i></i>
<i></i>
</span>

</div>

</div>

`;

$("messages")
.appendChild(row);

scroll();

}


/* =========================
   DATE / TIME
   DIRECT FROM PHONE
========================= */

function getIndiaDateTime(){

const now =
new Date();

const date =
new Intl.DateTimeFormat(
"en-IN",
{
timeZone:"Asia/Kolkata",
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
).format(now);

const time =
new Intl.DateTimeFormat(
"en-IN",
{
timeZone:"Asia/Kolkata",
hour:"numeric",
minute:"2-digit",
second:"2-digit",
hour12:true
}
).format(now);

return {
date,
time
};

}


function detectDateTimeQuestion(text){

const q =
text
.toLowerCase()
.trim()
.replace(/[?!.,]/g,"")
.replace(/\s+/g," ");

const datePatterns = [

/^today$/,

/^date$/,

/^today date$/,

/^todays date$/,

/^today's date$/,

/^what is today's date$/,

/^what is todays date$/,

/^what is the date today$/,

/^what date is today$/,

/^what is today date$/,

/^what is todays date today$/,

/^current date$/,

/^what is the current date$/,

/^what day is today$/,

/^which day is today$/,

/^what day is it$/,

/^what day is it today$/,

/^what's today's date$/

];

const timePatterns = [

/^time$/,

/^current time$/,

/^time now$/,

/^what time is it$/,

/^what is the time$/,

/^what is the current time$/,

/^what time is it now$/,

/^what is the time now$/,

/^what's the time$/

];

if(
datePatterns.some(
pattern => pattern.test(q)
)
){

return "date";

}

if(
timePatterns.some(
pattern => pattern.test(q)
)
){

return "time";

}

return null;

}


function directDateTimeReply(type){

const {
date,
time
} =
getIndiaDateTime();

if(type === "time"){

return `The current time in India is ${time}.`;

}

return `Today's date is ${date}.`;

}


/* =========================
   SAVE MESSAGE
========================= */

function storeMessage(
role,
content,
image = null
){

current().messages.push({

role,
content,
image

});

save();

}


function setTitle(text){

const c =
current();

if(
c.messages.length === 1 &&
c.title === "New Conversation"
){

c.title =
(text || "Image conversation")
.replace(/\s+/g," ")
.slice(0,42);

save();

renderHistory();

}

}


/* =========================
   SEND
========================= */

async function send(){

if(busy){
return;
}

const p =
$("prompt")
.value
.trim();

if(!p && !attached){
return;
}


/* DIRECT DATE/TIME FIX */

const dateTimeType =
p &&
!attached
? detectDateTimeQuestion(p)
: null;

if(dateTimeType){

storeMessage(
"user",
p
);

addUI(
"user",
p
);

setTitle(p);

$("prompt").value = "";

resize();

const reply =
directDateTimeReply(
dateTimeType
);

storeMessage(
"assistant",
reply
);

addUI(
"assistant",
reply
);

return;

}


/* NORMAL AI REQUEST */

const image =
attached;

storeMessage(
"user",
p,
image
);

addUI(
"user",
p,
image
);

setTitle(p);

$("prompt").value = "";

resize();

clearImage();

busy = true;

$("sendBtn").disabled =
true;

typing(true);

try{

const history =
current()
.messages
.slice(-30)
.map(m => ({

role:m.role,

content:m.content,

image:m.image || null

}));

const savedSystem =
localStorage.getItem(
SYSTEM_KEY
) || "";

const system =
CREATOR_IDENTITY +
(
savedSystem.trim()
?
"\n\nAdditional user instructions:\n" +
savedSystem
:
""
);

const response =
await fetch(
API_URL,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

message:p,

system,

history,

image:image || null

})

}
);

const data =
await response
.json()
.catch(() => ({}));

if(!response.ok){

throw new Error(
data.error ||
"Server error: " +
response.status
);

}

const reply =
data.reply ||
data.message ||
data.text ||
data.output ||
"I couldn't generate a response.";

typing(false);

storeMessage(
"assistant",
reply
);

addUI(
"assistant",
reply
);

}catch(error){

typing(false);

const message =
"⚠️ Connection error: " +
(
error.message ||
"Unable to connect to SARVESH AI."
);

storeMessage(
"assistant",
message
);

addUI(
"assistant",
message
);

}finally{

busy = false;

$("sendBtn")
.disabled = false;

}

}

/* =========================
   MICROPHONE
   INPUT ONLY
========================= */

function setupMic(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

$("mic").title =
"Voice input unavailable";

return;

}

rec =
new SpeechRecognition();

rec.lang =
"en-IN";

rec.interimResults =
true;

rec.continuous =
false;

rec.onstart =
() => {

listening = true;

$("status")
.textContent =
"LISTENING • SECURE";

};

rec.onend =
() => {

listening = false;

$("status")
.textContent =
"ONLINE • SECURE";

};

rec.onresult =
event => {

let text = "";

for(
let i = event.resultIndex;
i < event.results.length;
i++
){

text +=
event.results[i][0]
.transcript;

}

$("prompt").value =
text;

resize();

};

}


$("mic").onclick =
() => {

if(!rec){

alert(
"Voice input is not supported by this browser."
);

return;

}

try{

if(listening){

rec.stop();

}else{

rec.start();

}

}catch(e){}

};
