<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#020617">
<title>SARVESH AI</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020617;
  color:#e5f6ff;
  font-family:Inter,system-ui,sans-serif
}
button,textarea,input{font:inherit}
button{cursor:pointer}

#space{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 50% 35%,rgba(8,47,73,.3),transparent 45%),
    #020617;
  z-index:0
}

#space:before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(#67e8f9 1px,transparent 1px);
  background-size:58px 58px;
  opacity:.12
}

#loading{
  position:fixed;
  inset:0;
  z-index:99;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#020617
}

.loader{
  width:42px;
  height:42px;
  border:3px solid #164e63;
  border-top-color:#67e8f9;
  border-radius:50%;
  animation:s .8s linear infinite
}

@keyframes s{
  to{transform:rotate(360deg)}
}

#app{
  display:none;
  position:relative;
  z-index:2;
  width:100%;
  height:100%
}

#sidebar{
  position:fixed;
  inset:0 auto 0 0;
  width:290px;
  background:rgba(2,6,23,.96);
  backdrop-filter:blur(20px);
  border-right:1px solid rgba(103,232,249,.1);
  z-index:40;
  transform:translateX(-100%);
  transition:.25s;
  padding:20px;
  display:flex;
  flex-direction:column
}

#sidebar.open{
  transform:none
}

.brand-title{
  font-size:20px;
  font-weight:800;
  letter-spacing:.18em;
  color:#67e8f9
}

.brand-sub{
  font-size:10px;
  letter-spacing:.2em;
  color:#64748b;
  margin:5px 0 20px
}

.side-btn{
  width:100%;
  padding:12px;
  border:1px solid transparent;
  border-radius:13px;
  background:transparent;
  color:#a5b4c5;
  text-align:left;
  margin:3px 0
}

.side-btn:hover{
  background:#082f4933;
  border-color:#22d3ee22;
  color:#e6fbff
}

.history{
  flex:1;
  overflow:auto;
  margin-top:10px
}

.hist{
  padding:10px;
  border-radius:10px;
  color:#94a3b8;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.hist.active{
  background:#22d3ee12;
  color:#cffafe;
  border:1px solid #22d3ee22
}

main{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column
}

.topbar{
  height:64px;
  flex:0 0 64px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:0 12px;
  border-bottom:1px solid #67e8f914;
  background:#02061799;
  backdrop-filter:blur(16px)
}

.top-title{
  flex:1
}

.top-title strong{
  font-size:12px;
  letter-spacing:.15em;
  color:#c7f9ff
}

.top-title small{
  display:block;
  font-size:9px;
  letter-spacing:.12em;
  color:#22c55e;
  margin-top:2px
}

.icon-btn{
  flex:0 0 auto;
  width:43px;
  height:43px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:13px;
  color:#67e8f9;
  background:#22d3ee0f;
  border:1px solid #22d3ee22;
  transition:.2s
}

.icon-btn:hover{
  background:#22d3ee22;
  border-color:#22d3ee59;
  box-shadow:0 0 18px #22d3ee1f
}

.icon-btn svg{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}

#sendBtn{
  color:#020617;
  background:#67e8f9;
  border-color:#67e8f9
}

#messages{
  flex:1;
  overflow:auto;
  padding:18px 14px 145px
}

.welcome{
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center
}

.orb{
  width:118px;
  height:118px;
  border-radius:50%;
  background:
    radial-gradient(
      circle at 35% 30%,
      #cffafe,
      #22d3ee 20%,
      #0891b2 42%,
      #082f49 72%,
      #020617
    );
  box-shadow:0 0 35px #22d3ee55;
  animation:p 3s ease-in-out infinite
}

@keyframes p{
  50%{transform:scale(1.05)}
}

.welcome h1{
  margin:18px 0 5px;
  font-size:25px;
  letter-spacing:.08em
}

.welcome p{
  margin:0;
  color:#64748b;
  font-size:12px
}

.msg{
  max-width:900px;
  margin:0 auto 16px;
  display:flex
}

.msg.user{
  justify-content:flex-end
}

.bubble{
  max-width:min(86%,760px);
  padding:12px 14px;
  border-radius:16px;
  border:1px solid #67e8f912;
  background:#0f172acc;
  line-height:1.55;
  font-size:14px;
  overflow-wrap:anywhere
}

.msg.user .bubble{
  background:#082f49b8;
  border-color:#22d3ee29
}

.assistant-row{
  display:flex;
  gap:8px;
  align-items:flex-start;
  max-width:min(90%,820px)
}

.message-speaker{
  display:none
}

.bubble img{
  max-width:100%;
  border-radius:12px
}

.bubble pre{
  overflow:auto;
  background:#020617;
  border-radius:10px;
  padding:10px
}

.input-zone{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:20;
  padding:12px;
  background:linear-gradient(transparent,#020617 30%);
  pointer-events:none
}

.composer{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:8px;
  background:#0f172aed;
  border:1px solid #67e8f921;
  border-radius:18px;
  pointer-events:auto
}

.composer textarea{
  flex:1;
  min-width:0;
  max-height:130px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#e2faff;
  padding:11px 4px
}

.popup{
  position:fixed;
  z-index:60;
  display:none;
  min-width:190px;
  padding:7px;
  background:#020617f7;
  border:1px solid #67e8f929;
  border-radius:14px;
  box-shadow:0 18px 55px #0008
}

.popup button{
  display:block;
  width:100%;
  text-align:left;
  padding:10px;
  border:0;
  background:transparent;
  color:#cbd5e1;
  border-radius:9px
}

.popup button:hover{
  background:#22d3ee12;
  color:#ecfeff
}

.modal-bg{
  position:fixed;
  inset:0;
  z-index:80;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#000a;
  backdrop-filter:blur(8px)
}

.modal{
  width:min(440px,100%);
  background:#07101f;
  border:1px solid #67e8f929;
  border-radius:18px;
  padding:18px
}

.modal h3{
  margin:0 0 12px;
  color:#cffafe
}

.modal input,
.modal textarea{
  width:100%;
  background:#020617;
  color:#e2faff;
  border:1px solid #67e8f922;
  border-radius:11px;
  padding:11px;
  outline:0
}

.modal textarea{
  min-height:150px
}

.actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:12px
}

.actions button{
  padding:9px 13px;
  border-radius:10px;
  border:1px solid #67e8f922;
  background:#22d3ee12;
  color:#bff8ff
}

.actions .primary{
  background:#67e8f9;
  color:#020617
}

.typing i{
  display:inline-block;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#67e8f9;
  margin:2px;
  animation:d 1s infinite
}

.typing i:nth-child(2){
  animation-delay:.15s
}

.typing i:nth-child(3){
  animation-delay:.3s
}

@keyframes d{
  50%{
    opacity:.2;
    transform:translateY(-3px)
  }
}

#imagePreview{
  display:none;
  max-width:900px;
  margin:0 auto 7px;
  padding:7px 10px;
  border-radius:12px;
  background:#0f172af0;
  border:1px solid #67e8f922;
  pointer-events:auto;
  align-items:center
}

.muted{
  font-size:11px;
  color:#64748b
}

@media(max-width:600px){
  .bubble{
    max-width:90%
  }

  .orb{
    width:96px;
    height:96px
  }
}
</style>
</head>

<body>

<div id="space"></div>

<div id="loading">
  <div class="loader"></div>
</div>

<div id="app">

<aside id="sidebar">

  <div class="brand-title">SARVESH AI</div>
  <div class="brand-sub">NEURAL INTELLIGENCE</div>

  <button class="side-btn" id="newChat">
    ＋ New Conversation
  </button>

  <button class="side-btn" id="memory">
    ◈ Memory Stream
  </button>

  <div class="history" id="history"></div>

  <button class="side-btn" id="settings">
    ⚙ Settings
  </button>

  <button class="side-btn" id="closeSide">
    × Close
  </button>

</aside>

<main>

<header class="topbar">

  <button
    class="icon-btn"
    id="menu"
    aria-label="Open menu"
    title="Open menu"
  >
    <svg viewBox="0 0 24 24">
      <path d="M4 7h16M4 12h16M4 17h16"/>
    </svg>
  </button>

  <div class="top-title">
    <strong>NEURAL CORE</strong>
    <small id="status">ONLINE • SECURE</small>
  </div>

</header>

<section id="messages"></section>

<div class="input-zone">

  <div id="imagePreview"></div>

  <div class="composer">

    <button
      type="button"
      class="icon-btn"
      id="imageBtn"
      aria-label="Attach image"
      title="Attach image"
    >
      <svg viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <circle cx="8" cy="9" r="1.5"/>
        <path d="M3 17l5-5 4 4 3-3 6 5"/>
      </svg>
    </button>

    <button
      type="button"
      class="icon-btn"
      id="tools"
      aria-label="Tools"
      title="Tools"
    >
      <svg viewBox="0 0 24 24">
        <path d="M12 3l1.5 5L18 10l-4.5 1.5L12 17l-1.5-5L6 10l4.5-1.5z"/>
        <path d="M19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7z"/>
      </svg>
    </button>

    <textarea
      id="prompt"
      rows="1"
      placeholder="Message SARVESH AI..."
    ></textarea>

    <button
      type="button"
      class="icon-btn"
      id="mic"
      aria-label="Voice input"
      title="Voice input"
    >
      <svg viewBox="0 0 24 24">
        <rect x="9" y="3" width="6" height="12" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>
      </svg>
    </button>

    <button
      type="button"
      class="icon-btn"
      id="sendBtn"
      aria-label="Send"
      title="Send"
    >
      <svg viewBox="0 0 24 24">
        <path d="M4 5l16 7-16 7 3-7z"/>
        <path d="M7 12h10"/>
      </svg>
    </button>

  </div>
</div>

</main>
</div>

<div class="popup" id="chatMenu">
  <button id="rename">✎ Rename</button>
  <button id="del">⌫ Delete</button>
</div>

<div class="popup" id="toolMenu">
  <button data-tool="Summarize">Summarize</button>
  <button data-tool="Explain">Explain</button>
  <button data-tool="Translate">Translate</button>
  <button data-tool="Rewrite">Rewrite</button>
  <button data-tool="Brainstorm">Brainstorm</button>
  <button data-tool="Code">Code</button>
</div>

<div class="modal-bg" id="renameModal">

  <div class="modal">

    <h3>Rename conversation</h3>

    <input id="renameInput">

    <div class="actions">
      <button id="renameCancel">Cancel</button>
      <button class="primary" id="renameSave">Save</button>
    </div>

  </div>

</div>

<div class="modal-bg" id="deleteModal">

  <div class="modal">

    <h3>Delete conversation?</h3>

    <div class="muted">
      This removes the selected conversation from this device.
    </div>

    <div class="actions">
      <button id="deleteCancel">Cancel</button>
      <button class="primary" id="deleteConfirm">Delete</button>
    </div>

  </div>

</div>

<div class="modal-bg" id="settingsModal">

  <div class="modal">

    <h3>System instructions</h3>

    <textarea id="systemInput"></textarea>

    <div class="actions">
      <button id="settingsCancel">Cancel</button>
      <button class="primary" id="settingsSave">Save</button>
    </div>

  </div>

</div>

<input id="file" type="file" accept="image/*" hidden>

<script>
const API_URL =
  "https://sarvesh-ai.sarveshghane77.workers.dev";

const CK = "sarvesh_chats_v7";
const AK = "sarvesh_active_v7";
const SK = "sarvesh_system_v7";

let chats = [];
let active = null;
let selected = null;
let attached = null;
let busy = false;
let rec = null;
let listening = false;

const $ = id => document.getElementById(id);

const uid = () =>
  Date.now() + Math.random().toString(36).slice(2,7);

const esc = s =>
  String(s ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;");

function fmt(s){

  let x = esc(s);

  x = x
    .replace(/```([\s\S]*?)```/g,
      "<pre><code>$1</code></pre>")
    .replace(/`([^`]+)`/g,
      "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,
      "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g,
      "<em>$1</em>")
    .replace(
      /(https?:\/\/[^\s<]+)/g,
      '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
    );

  return x.replace(/\n/g,"<br>");
}

function save(){

  localStorage.setItem(
    CK,
    JSON.stringify(chats)
  );

  localStorage.setItem(
    AK,
    active || ""
  );
}

function load(){

  try{
    chats =
      JSON.parse(
        localStorage.getItem(CK) || "[]"
      );
  }catch(e){
    chats = [];
  }

  active =
    localStorage.getItem(AK);

  if(!Array.isArray(chats)){
    chats = [];
  }

  if(!chats.length){

    const c = {
      id:uid(),
      title:"New Conversation",
      messages:[]
    };

    chats = [c];
    active = c.id;

    save();
  }

  if(!chats.some(c => c.id === active)){
    active = chats[0].id;
  }
}

function current(){

  return (
    chats.find(c => c.id === active) ||
    chats[0]
  );
}

function renderHistory(){

  const h = $("history");

  h.innerHTML = "";

  chats.forEach(c => {

    const row =
      document.createElement("div");

    row.className =
      "hist " +
      (c.id === active ? "active" : "");

    row.style.display = "flex";
    row.style.alignItems = "center";
    row.style.gap = "5px";

    const t =
      document.createElement("span");

    t.textContent = c.title;

    t.style.cssText =
      "flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap";

    const b =
      document.createElement("button");

    b.className = "icon-btn";

    b.style.cssText =
      "width:30px;height:30px;border:0;background:transparent";

    b.title = "Conversation options";

    b.setAttribute(
      "aria-label",
      "Conversation options"
    );

    b.innerHTML = `
      <svg viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1.2"
          fill="currentColor" stroke="none"/>
        <circle cx="12" cy="12" r="1.2"
          fill="currentColor" stroke="none"/>
        <circle cx="19" cy="12" r="1.2"
          fill="currentColor" stroke="none"/>
      </svg>
    `;

    b.onclick = e => {

      e.stopPropagation();

      selected = c.id;

      openChatMenu(
        e.clientX,
        e.clientY
      );
    };

    row.onclick = () => {

      active = c.id;

      save();
      renderHistory();
      render();

      $("sidebar").classList.remove("open");
    };

    row.append(t,b);

    h.appendChild(row);

  });
}

function render(){

  const box = $("messages");
  const c = current();

  box.innerHTML = "";

  if(!c.messages.length){

    box.innerHTML = `
      <div class="welcome">
        <div>
          <div class="orb"></div>
          <h1>SARVESH AI</h1>
          <p>
            Neural intelligence created and developed by Sarvesh Ghane.
          </p>
        </div>
      </div>
    `;

    return;
  }

  c.messages.forEach(m =>
    addUI(
      m.role,
      m.content,
      m.image,
      false
    )
  );

  scroll();
}

function addUI(
  role,
  text,
  img = null,
  go = true
){

  const r =
    document.createElement("div");

  r.className =
    "msg " + role;

  const b =
    document.createElement("div");

  b.className = "bubble";

  if(img){

    const i =
      document.createElement("img");

    i.src = img;
    i.alt = "Attached image";

    i.style.cssText =
      "display:block;max-width:280px;max-height:360px;object-fit:contain;margin-bottom:" +
      (text ? 8 : 0) +
      "px";

    b.appendChild(i);
  }

  if(text){

    const t =
      document.createElement("div");

    t.innerHTML = fmt(text);

    b.appendChild(t);
  }

  if(role === "assistant"){

    const row =
      document.createElement("div");

    row.className =
      "assistant-row";

    row.innerHTML = `
      <div style="
        width:28px;
        height:28px;
        flex:0 0 28px;
        border-radius:9px;
        background:#22d3ee0f;
        border:1px solid #22d3ee22;
        display:flex;
        align-items:center;
        justify-content:center
      ">
        <svg
          viewBox="0 0 24 24"
          style="
            width:16px;
            height:16px;
            fill:none;
            stroke:#67e8f9;
            stroke-width:1.5;
            stroke-linecap:round
          "
        >
          <path d="M12 3v18M3 12h18M5.5 5.5l13 13M18.5 5.5l-13 13"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </div>
    `;

    row.appendChild(b);

    r.appendChild(row);

  }else{

    r.appendChild(b);
  }

  $("messages").appendChild(r);

  if(go){
    scroll();
  }
}

function scroll(){

  requestAnimationFrame(() =>
    $("messages").scrollTop =
      $("messages").scrollHeight
  );
}

function typing(on){

  $("messages")
    .querySelector(".typingRow")
    ?.remove();

  if(on){

    const r =
      document.createElement("div");

    r.className =
      "msg assistant typingRow";

    r.innerHTML = `
      <div class="assistant-row">
        <div style="width:28px;height:28px"></div>

        <div class="bubble">
          <span class="typing">
            <i></i>
            <i></i>
            <i></i>
          </span>
        </div>
      </div>
    `;

    $("messages").appendChild(r);

    scroll();
  }
}

function add(
  role,
  content,
  img = null
){

  current().messages.push({
    role,
    content:content || "",
    image:img || null
  });

  save();
}

function setTitle(t){

  const c = current();

  if(
    c.messages.length === 1 &&
    c.title === "New Conversation"
  ){

    c.title =
      (t || "Image conversation")
        .replace(/\s+/g," ")
        .slice(0,42);

    save();
    renderHistory();
  }
}

function resize(){

  const t = $("prompt");

  t.style.height = "auto";

  t.style.height =
    Math.min(t.scrollHeight,130) + "px";
}

async function send(){

  if(busy){
    return;
  }

  const p =
    $("prompt").value.trim();

  if(!p && !attached){
    return;
  }

  const img = attached;

  add(
    "user",
    p,
    img
  );

  addUI(
    "user",
    p,
    img
  );

  setTitle(p);

  $("prompt").value = "";

  resize();

  clearImage();

  busy = true;

  $("sendBtn").disabled = true;

  typing(true);

  try{

    const history =
      current()
        .messages
        .slice(-30)
        .map(m => ({
          role:m.role,
          content:m.content,
          image:m.image || null
        }));

    const system =
      localStorage.getItem(SK) || "";

    const r =
      await fetch(
        API_URL + "/chat",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            messages:history,
            system
          })
        }
      );

    const d =
      await r.json()
        .catch(() => ({}));

    if(
      !r.ok ||
      !d.success
    ){
      throw Error(
        d.error ||
        "AI server error."
      );
    }

    const reply =
      d.reply ||
      "I could not produce a response.";

    typing(false);

    add(
      "assistant",
      reply
    );

    addUI(
      "assistant",
      reply
    );

  }catch(e){

    typing(false);

    const m =
      "Connection error: " +
      (e.message ||
       "Unknown error");

    add(
      "assistant",
      m
    );

    addUI(
      "assistant",
      m
    );

  }finally{

    busy = false;

    $("sendBtn").disabled = false;
  }
}

/* IMAGE ATTACHMENT ONLY.
   THERE IS NO PAID IMAGE GENERATION. */

$("imageBtn").onclick =
  () => $("file").click();

$("file").onchange = () => {

  const f =
    $("file").files[0];

  if(!f){
    return;
  }

  if(!f.type.startsWith("image/")){

    alert(
      "Please select an image file."
    );

    return;
  }

  const r =
    new FileReader();

  r.onload = () => {

    attached = r.result;

    $("imagePreview")
      .style.display = "flex";

    $("imagePreview").innerHTML = `
      <img
        src="${attached}"
        style="
          width:48px;
          height:48px;
          object-fit:cover;
          border-radius:8px
        "
      >

      <span style="
        margin-left:9px;
        color:#94a3b8;
        font-size:12px
      ">
        Image attached
      </span>

      <button
        id="removeImage"
        class="icon-btn"
        aria-label="Remove image"
        title="Remove image"
        style="
          margin-left:auto;
          width:32px;
          height:32px
        "
      >
        <svg viewBox="0 0 24 24">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    `;

    $("removeImage").onclick =
      clearImage;
  };

  r.readAsDataURL(f);
};

function clearImage(){

  attached = null;

  $("file").value = "";

  $("imagePreview")
    .style.display = "none";

  $("imagePreview").innerHTML = "";
}

/* TOOLS */

$("tools").onclick = e => {

  const r =
    e.currentTarget.getBoundingClientRect();

  const m =
    $("toolMenu");

  m.style.display =
    m.style.display === "block"
      ? "none"
      : "block";

  m.style.left =
    Math.max(
      8,
      Math.min(
        r.left,
        innerWidth - 205
      )
    ) + "px";

  m.style.bottom =
    (innerHeight - r.top + 8) + "px";
};

const prompts = {

  Summarize:
    "Summarize the following clearly and briefly:\n",

  Explain:
    "Explain the following in simple language:\n",

  Translate:
    "Translate the following into Hindi unless another language is specified:\n",

  Rewrite:
    "Rewrite the following clearly and naturally:\n",

  Brainstorm:
    "Brainstorm useful ideas for the following:\n",

  Code:
    "Provide a complete coding solution for the following:\n"
};

document
  .querySelectorAll("#toolMenu button")
  .forEach(b => {

    b.onclick = () => {

      $("prompt").value =
        prompts[b.dataset.tool];

      resize();

      $("prompt").focus();

      closePop();
    };
  });

/* SIDEBAR */

$("menu").onclick =
  () =>
    $("sidebar").classList.toggle("open");

$("closeSide").onclick =
  () =>
    $("sidebar").classList.remove("open");

$("newChat").onclick = () => {

  const c = {
    id:uid(),
    title:"New Conversation",
    messages:[]
  };

  chats.unshift(c);

  active = c.id;

  save();

  renderHistory();

  render();

  $("sidebar")
    .classList.remove("open");
};

/* MEMORY */

$("memory").onclick = () => {

  const m =
    current()
      .messages
      .filter(x => x.role === "user")
      .map(x => x.content)
      .filter(Boolean)
      .slice(-10)
      .join("\n\n");

  alert(
    "Memory Stream\n\n" +
    "Recent conversation is stored locally on this device.\n\n" +
    (m || "No user messages yet.")
  );
};

/* SETTINGS */

$("settings").onclick = () => {

  $("systemInput").value =
    localStorage.getItem(SK) || "";

  $("settingsModal")
    .style.display = "flex";
};

$("settingsCancel").onclick =
  () =>
    $("settingsModal")
      .style.display = "none";

$("settingsSave").onclick = () => {

  localStorage.setItem(
    SK,
    $("systemInput").value
  );

  $("settingsModal")
    .style.display = "none";
};

/* RENAME / DELETE */

function openChatMenu(x,y){

  const m =
    $("chatMenu");

  m.style.display = "block";

  m.style.left =
    Math.min(
      x,
      innerWidth - 205
    ) + "px";

  m.style.top =
    Math.min(
      y,
      innerHeight - 120
    ) + "px";
}

function closePop(){

  document
    .querySelectorAll(".popup")
    .forEach(x =>
      x.style.display = "none"
    );
}

$("rename").onclick = () => {

  closePop();

  const c =
    chats.find(
      x => x.id === selected
    ) || current();

  $("renameInput").value =
    c.title;

  $("renameModal")
    .style.display = "flex";
};

$("renameCancel").onclick =
  () =>
    $("renameModal")
      .style.display = "none";

$("renameSave").onclick = () => {

  const c =
    chats.find(
      x => x.id === selected
    ) || current();

  c.title =
    $("renameInput")
      .value
      .trim() ||
    "New Conversation";

  save();

  renderHistory();

  $("renameModal")
    .style.display = "none";
};

$("del").onclick = () => {

  closePop();

  $("deleteModal")
    .style.display = "flex";
};

$("deleteCancel").onclick =
  () =>
    $("deleteModal")
      .style.display = "none";

$("deleteConfirm").onclick = () => {

  chats =
    chats.filter(
      c =>
        c.id !==
        (selected || active)
    );

  if(!chats.length){

    const c = {
      id:uid(),
      title:"New Conversation",
      messages:[]
    };

    chats = [c];

    active = c.id;

  }else{

    active =
      chats[0].id;
  }

  save();

  renderHistory();

  render();

  $("deleteModal")
    .style.display = "none";
};

/* MICROPHONE INPUT ONLY.
   NO VOICE READING. */

function setupMic(){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SR){

    $("mic").title =
      "Voice input unavailable";

    return;
  }

  rec = new SR();

  rec.lang = "en-IN";

  rec.interimResults = true;

  rec.continuous = false;

  rec.onstart = () => {

    $("mic")
      .classList.add("active");

    $("status").textContent =
      "LISTENING • SECURE";
  };

  rec.onend = () => {

    $("mic")
      .classList.remove("active");

    $("status").textContent =
      "ONLINE • SECURE";
  };

  rec.onresult = e => {

    let t = "";

    for(
      let i = e.resultIndex;
      i < e.results.length;
      i++
    ){

      t +=
        e.results[i][0].transcript;
    }

    $("prompt").value = t;

    resize();
  };
}

$("mic").onclick = () => {

  if(!rec){

    alert(
      "Voice input is not supported by this browser/WebView."
    );

    return;
  }

  try{

    if(listening){

      rec.stop();

      listening = false;

    }else{

      rec.start();

      listening = true;
    }

  }catch(e){}
};

/* NO SPEECH SYNTHESIS.
   NO VOICE READING. */

$("sendBtn").onclick =
  send;

$("prompt").oninput =
  resize;

$("prompt").onkeydown = e => {

  if(
    e.key === "Enter" &&
    !e.shiftKey
  ){

    e.preventDefault();

    send();
  }
};

document.onclick = e => {

  if(
    !e.target.closest("#chatMenu") &&
    !e.target.closest(".hist")
  ){

    $("chatMenu")
      .style.display = "none";
  }

  if(
    !e.target.closest("#toolMenu") &&
    !e.target.closest("#tools")
  ){

    $("toolMenu")
      .style.display = "none";
  }
};

async function start(){

  load();

  renderHistory();

  render();

  setupMic();

  $("loading")
    .style.display = "none";

  $("app")
    .style.display = "block";

  try{

    const r =
      await fetch(
        API_URL + "/health"
      );

    if(!r.ok){

      $("status").textContent =
        "CORE CONNECTION ISSUE";
    }

  }catch(e){}
}

start();
</script>
